:root{--navy:#051D49;--orange:#FF5D36;--peach:#FFA168;--blue:#0071CE;--muted:#464D7E;--line:#BDC9E9;--paper:#F7F8FC;--tint:#E5E9F6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:Elm,Tahoma,sans-serif;color:var(--navy);direction:rtl;text-align:right}
.wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.card{background:#fff;border:1px solid var(--tint);border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(5,29,73,.06)}
.head img{display:block;width:100%;height:auto}
.body{padding:28px 28px 32px}
h1{font-size:24px;line-height:1.5;margin:0 0 10px;font-weight:700}
.lead{font-size:16px;line-height:1.9;color:var(--muted);margin:0 0 26px}
label{display:block;font-weight:700;font-size:17px;line-height:1.7;margin:0 0 10px}
label .req{color:var(--orange)}
label .opt{color:var(--muted);font-weight:500;font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.starter{display:inline-block;background:var(--tint);color:var(--navy);border-radius:8px;padding:6px 12px;font-size:15px;margin-bottom:10px;font-weight:500}
textarea,input{width:100%;font-family:inherit;font-size:16px;color:var(--navy);border:1.5px solid var(--line);border-radius:10px;padding:14px;background:#fff;direction:rtl;text-align:right;outline:none;transition:border-color .15s}
textarea{min-height:140px;resize:vertical;line-height:1.8}
textarea:focus,input:focus{border-color:var(--blue)}
.field{margin-bottom:24px}
button{width:100%;font-family:inherit;font-weight:700;font-size:18px;color:#fff;background:var(--orange);border:0;border-radius:10px;padding:15px;cursor:pointer;transition:opacity .15s}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--orange);font-size:14px;margin:-14px 0 16px;display:none}
.thanks{display:none;text-align:center;padding:40px 28px 44px}
.thanks h2{font-size:24px;margin:0 0 10px}
.thanks p{font-size:16px;line-height:1.9;color:var(--muted);margin:0}
.mark{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--peach);font-size:34px;line-height:64px;margin:0 auto 18px}
.foot{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
@media (max-width:480px){.body{padding:22px 18px 26px}h1{font-size:21px}}
</style>
</head>

  <form class="body" id="f" novalidate>
   <h1>لو فشلت مسودة الابتكار، ليش؟</h1>
   <p class="lead">تخيّل إننا في نهاية ديسمبر، ونشرة مسودة الابتكار توقفت، وما أحد افتقدها. اكتب لنا ليش فشلت بصراحة.</p>
   <div class="field">
    <label for="reason">كمّل الجملة <span class="req">*</span></label>
    <div class="starter">كانت ماشية زين، لين…</div>
    <textarea id="reason" name="reason" placeholder="اكتب السبب اللي ممكن يوقّفها"></textarea>
   </div>
   <p class="err" id="err">اكتب السبب قبل الإرسال.</p>
   <div class="field">
    <label for="name">اسمك <span class="opt">(اختياري)</span></label>
    <input id="name" name="name" type="text" autocomplete="name">
   </div>
   <button type="submit" id="btn">أرسل</button>
  </form>
  <div class="thanks" id="thanks">
   <div class="mark">✓</div>
   <h2>شكرًا لك</h2>
   <p>وصلنا سببك، وبنستفيد منه نخلي مسودة الابتكار ما تفشل.</p>
  </div>
 </div>
 <div class="foot">مسودة الابتكار · نشرة إدارة الابتكار</div>
</div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxZVttxWMmqKG097CZz0EL-kVm2z9TGxJ-6fHRuKuKGnR1OcskIPQ6Vyyj0D78wQPIt/exec';
const f=document.getElementById('f'),btn=document.getElementById('btn'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{
 e.preventDefault();
 const reason=document.getElementById('reason').value.trim(),name=document.getElementById('name').value.trim();
 if(!reason){err.style.display='block';document.getElementById('reason').focus();return;}
 err.style.display='none';btn.disabled=true;btn.textContent='جاري الإرسال…';
 try{
  await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({reason,name})});
  f.style.display='none';document.getElementById('thanks').style.display='block';
 }catch(x){btn.disabled=false;btn.textContent='أرسل';err.textContent='ما وصل الإرسال، جرّب مرة ثانية.';err.style.display='block';}
});
</script>
